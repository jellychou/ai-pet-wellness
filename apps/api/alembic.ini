[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 這裡故意留空，實際的資料庫連線字串在 alembic/env.py 裡
# 從 app.core.config 的 Settings（.env）動態讀取，避免帳密寫兩份。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
